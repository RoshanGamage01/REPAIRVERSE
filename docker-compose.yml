# Single-host deployment of REPAIRVERSE.
#   cp .env.example .env   # set APP_SECRET, ADMIN_PASSWORD
#   docker compose up -d --build
#   docker compose run --rm api node dist/seed.js     # taxonomy + admin (+ demo data if SEED_DEMO=true)
services:
  db:
    # pgvector image; PostGIS is added by infra/db-init.sh on first start.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: repairverse
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init.sh:/docker-entrypoint-initdb.d/00-extensions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-repairverse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-repairverse-secret}
    volumes: [objects:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set rv http://minio:9000 $${S3_ACCESS_KEY_ID:-repairverse} $${S3_SECRET_ACCESS_KEY:-repairverse-secret}; do sleep 1; done;
             mc mb -p rv/repairverse-files && mc anonymous set none rv/repairverse-files"

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment: &appenv
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/repairverse
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: s3
      S3_BUCKET: repairverse-files
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-repairverse}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-repairverse-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@repairverse.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-false}
      RUN_WORKER_IN_PROCESS: "false"
    ports: ["4000:4000"]

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on: [api]
    environment: *appenv

  backup:
    image: pgvector/pgvector:pg16
    depends_on: [db]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes: [backups:/backups, ./infra/backup.sh:/backup.sh:ro]
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]

volumes:
  pgdata:
  objects:
  backups:
